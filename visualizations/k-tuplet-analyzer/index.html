                    <div style={{color:'var(--tx2)', textAlign:'right'}}>expected</div>
                    {histInfo.keys.map(p => {
                        const actual = histInfo.hist.get(p) || 0;
                        const exp = histInfo.expected.get(p) || 0;
                        const maxScale = Math.max(actual, exp, 1) * 1.3;
                        const col = primeColor(p);
                        const dev = actual - exp;
                        const devColor = dev > exp * 0.3 ? 'var(--orange)' : dev < -exp * 0.3 ? 'var(--blue)' : 'var(--tx0)';
                        return (
                            <React.Fragment key={p}>
                                <div style={{color: col.fg, fontWeight:700}}>{p}</div>
                                <div className="hist-bar">
                                    <div className="fill" style={{width: `${actual/maxScale*100}%`, background: col.fg}}></div>
                                    <div className="expected" style={{left: `${exp/maxScale*100}%`}}></div>
                                </div>
                                <div style={{textAlign:'right', color: devColor, fontWeight: dev>0?700:400}}>{actual}</div>
                                <div style={{textAlign:'right', color:'var(--tx2)'}}>{exp.toFixed(2)}</div>
                            </React.Fragment>
                        );
                    })}
                    {histInfo.unknown > 0 && (
                        <>
                            <div style={{color:'var(--tx2)'}}>?</div>
                            <div style={{color:'var(--tx2)', fontStyle:'italic'}}>positions where smallest factor &gt; bound={BOUND_OPTIONS[boundIdx].toLocaleString()}</div>
                            <div style={{textAlign:'right', color:'var(--tx2)'}}>{histInfo.unknown}</div>
                            <div></div>
                        </>
                    )}
                    {histInfo.primes > 0 && (
                        <>
                            <div style={{color:'var(--green)', fontWeight:700}}>P</div>
                            <div style={{color:'var(--green)'}}>inter-member positions that are themselves prime (unexpected — would be a denser tuple if so)</div>
                            <div style={{textAlign:'right', color:'var(--green)', fontWeight:700}}>{histInfo.primes}</div>
                            <div></div>
                        </>
                    )}
                </div>
            </div>

            <div className="note">
                Inter-member positions in the closed interval [base, base+{last}] are guaranteed composite by
                admissibility for any record-grade tuple. The cells above show <em>which</em> small prime kills each.
                Same colour = same prime; horizontal/vertical regularities expose how the admissibility constraints
                are realised at this particular base.
            </div>
        </div>
    );
}

// ----- Per-member deep factorization -----
function DeepFactBlock({n, seedDepth=0, seedResult=null}) {
    const [depth, setDepth] = useState(seedDepth);
    const [computed, setComputed] = useState(seedResult ? {[seedDepth]: seedResult} : {});
    const [computing, setComputing] = useState(false);

    // Accept new seed values (e.g., when parent finishes auto-D1 batch)
    useEffect(() => {
        if (seedResult && seedDepth > 0) {
            setComputed(prev => prev[seedDepth] ? prev : {...prev, [seedDepth]: seedResult});
            setDepth(prev => prev === 0 ? seedDepth : prev);
        }
    }, [seedResult, seedDepth]);

    const compute = useCallback((d) => {
        if (computed[d] || computing) return;
        setComputing(true);
        setTimeout(() => {
            const r = computeDeepFact(BigInt(n), d, 0, new Map());
            setComputed(prev => ({...prev, [d]: r}));
            setDepth(d); setComputing(false);
        }, 10);
    }, [n, computed, computing]);
    return (
        <div>
            <div className="depth-btns">
                {[1,2,3,4].map(d => (
                    <button key={d}
                        className={`depth-btn ${depth===d?'active':''} ${computing?'computing':''}`}
                        onClick={()=>compute(d)} disabled={computing}>D{d}</button>
                ))}
            </div>
            {depth === 0 && <div style={{color:'var(--tx2)', fontSize:'9px'}}>Click D1..D4</div>}
            {computed[depth] && <DeepFactTree deep={computed[depth]} />}
        </div>
    );
}
function DeepFactTree({deep, depth=0}) {
    if (!deep) return null;
    return (
        <div style={{marginLeft: depth>0 ? 10 : 0}}>
            <div className="fact">{deep.taggedStr || deep.factStr}</div>
            {deep.children && deep.children.length > 0 && (
                <div className="fact-tree">
                    {deep.children.map((child, i) => (
                        <div key={i} className="fact-item">
                            <span className="prime">{child.prime.toString().length>20 ? `P${child.bits}b` : child.prime.toString()}</span>
                            <span style={{color:'var(--tx2)', fontSize:'8px', marginLeft:'4px'}}>({child.bits}b)</span>
                            <div style={{marginLeft:8, marginTop:2}}>
                                <span style={{color:'var(--tx2)', fontSize:'8px'}}>−1 = </span>
                                <span className="sub">{child.pm1?.taggedStr || child.pm1?.factStr || '1'}</span>
                            </div>
                            <div style={{marginLeft:8}}>
                                <span style={{color:'var(--tx2)', fontSize:'8px'}}>+1 = </span>
                                <span className="sub">{child.pp1?.taggedStr || child.pp1?.factStr || '1'}</span>
                            </div>
                            {child.pm1?.children?.length > 0 && <DeepFactTree deep={child.pm1} depth={depth+1} />}
                            {child.pp1?.children?.length > 0 && <DeepFactTree deep={child.pp1} depth={depth+1} />}
                        </div>
                    ))}
                </div>
            )}
        </div>
    );
}

function PerMemberFactPanel({res, expandAll, autoD1}) {
    // d1Cache[i] = {pm1: deep, pp1: deep}
    const [d1Cache, setD1Cache] = useState({});
    const [progress, setProgress] = useState(0);
    const [running, setRunning] = useState(false);
    const [elapsedMs, setElapsedMs] = useState(0);

    useEffect(() => {
        // reset on record change
        setD1Cache({});
        setProgress(0);
        setRunning(false);
        setElapsedMs(0);
    }, [res]);

    useEffect(() => {
        if (!autoD1) return;
        if (Object.keys(d1Cache).length === res.members.length) return;
        let cancelled = false;
        setRunning(true);
        const t0 = performance.now();
        const cache = {...d1Cache};
        let i = 0;
        const step = () => {
            if (cancelled) return;
            if (i >= res.members.length) {
                setRunning(false);
                setElapsedMs(Math.round(performance.now() - t0));
                return;
            }
            const m = res.members[i];
            if (!cache[m.i]) {
                const pm1 = computeDeepFact(m.val - 1n, 1, 0, new Map());
                const pp1 = computeDeepFact(m.val + 1n, 1, 0, new Map());
                cache[m.i] = {pm1, pp1};
                setD1Cache({...cache});
            }
            i++;
            setProgress(Math.round(i / res.members.length * 100));
            // Yield back to the browser between members so the UI stays responsive.
            setTimeout(step, 0);
        };
        setTimeout(step, 10);
        return () => { cancelled = true; };
    }, [res, autoD1]);

    return (
        <div>
            {autoD1 && running && (
                <div className="loading" style={{padding:'4px 8px', textAlign:'left', color:'var(--yellow)'}}>
                    Computing D1 for all {res.members.length} members… {progress}%
                </div>
            )}
            {autoD1 && !running && elapsedMs > 0 && (
                <div className="note" style={{marginBottom:'4px'}}>
                    D1 computed for all {res.members.length} members in {elapsedMs} ms.
                    Click D2/D3/D4 on any member for deeper recursion.
                </div>
            )}
            <div className="grid2">
                {res.members.map(m => {
                    const seed = d1Cache[m.i];
                    return (
                        <CollapsiblePanel
                            key={m.i}
                            title={`m${m.i} (+${m.offset}) ${m.prime?'✓PRIME':'✗comp'}`}
                            badge={`${m.bits}b`}
                            bc={m.prime?'bg-g':'bg-r'}
                            defaultOpen={autoD1}
                            forceOpen={expandAll || undefined}>
                            <div style={{fontSize:'9px', color:'var(--tx2)', marginBottom:'4px'}}>
                                ν₂(m−1)={m.v2pm1} | ν₂(m+1)={m.v2pp1} |
                                smooth(m−1)≤31 = {m.smPm1.smoothBits}b/{m.smPm1.remBits}b cofactor |
                                smooth(m+1)≤31 = {m.smPp1.smoothBits}b/{m.smPp1.remBits}b cofactor
                            </div>
                            <div className="dlayer"><span className="lbl">m−1</span></div>
                            <DeepFactBlock n={m.val - 1n}
                                seedDepth={seed ? 1 : 0} seedResult={seed?.pm1 || null} />
                            <div className="dlayer" style={{marginTop:6}}><span className="lbl">m+1</span></div>
                            <DeepFactBlock n={m.val + 1n}
                                seedDepth={seed ? 1 : 0} seedResult={seed?.pp1 || null} />
                        </CollapsiblePanel>
                    );
                })}
            </div>
        </div>
    );
}

// Wheel-depth panel: prime-by-prime admissibility ladder, plus a summary
// showing the catalog minimum and the maximum wheel consistent with this base.
function WheelDepthPanel({res, forceOpen}) {
    const wd = res.wd;
    if (!wd) return null;
    const minMod = res.modCheck?.modulus ?? null;
    const catMinP = res.catMinP;
    const deepest = wd.deepestP;
    const lastTested = wd.chain[wd.chain.length - 1].prime;
    const allPass = wd.breakP === null;
    const fmtBig = (n) => n.toString().length <= 16 ? n.toString() : n.toString().slice(0,8) + '…' + n.toString().slice(-6);

    return (
        <CollapsiblePanel
            title="Wheel-depth ladder (primorials this base is consistent with)"
            badge={allPass ? `≥ ${deepest}#` : `≤ ${deepest}#`}
            bc={allPass ? 'bg-g' : 'bg-y'}
            forceOpen={forceOpen}>
            <div className="wheel-summary">
                {catMinP && (
                    <span>
                        <span className="label">catalog minimum:</span>{' '}
                        <span className="val">{catMinP}#</span>{' '}
                        <span style={{color:'var(--tx2)'}}>= {minMod}</span>
                    </span>
                )}
                <span>
                    <span className="label">consistent up to:</span>{' '}
                    <span className="val" style={{color: allPass ? 'var(--green)' : 'var(--yellow)'}}>
                        {deepest}#
                    </span>{' '}
                    <span style={{color:'var(--tx2)'}}>
                        = {fmtBig(wd.chain.find(c => c.prime === deepest)?.primorial ?? 1n)}
                    </span>
                </span>
                {!allPass && (
                    <span>
                        <span className="label">breaks at:</span>{' '}
                        <span className="val" style={{color:'var(--red)'}}>÷{wd.breakP}</span>
                    </span>
                )}
                {allPass && (
                    <span style={{color:'var(--tx2)'}}>
                        (all primes tested up to {lastTested}# pass; deeper primes not checked)
                    </span>
                )}
            </div>
            <div className="wheel-ladder">
                {wd.chain.map((r, i) => {
                    const isCatMin = r.prime === catMinP;
                    const tooSmall = catMinP !== null && r.passes && r.prime < catMinP;
                    let state;
                    if (!r.passes) state = 'fail';
                    else if (tooSmall) state = 'too-small';
                    else state = 'pass';
                    const cls = `wheel-rung ${state} ${isCatMin ? 'cat-min' : ''}`;
                    const mark = state === 'fail' ? '✗' : state === 'too-small' ? '—' : '✓';
                    const title = !r.passes
                        ? `${r.prime}# breaks: base+offsets[${r.hitOffsetIdx}] (= +${res.offsets[r.hitOffsetIdx]}) is divisible by ${r.prime}`
                        : tooSmall
                            ? `${r.prime}# = ${r.primorial.toString()} · base passes admissibility at p=${r.prime}, but this wheel is BELOW the catalog minimum (${catMinP}#) — a search using only ${r.prime}# cannot enumerate this pattern's residue class.`
                            : `${r.prime}# = ${r.primorial.toString()} · base passes admissibility at p=${r.prime} · viable wheel choice for the search`;
                    return (
                        <div key={i} className={cls} title={title}>
                            <span className="p-label">{r.prime}#</span>
                            <span className="mark">{mark}</span>
                        </div>
                    );
                })}
            </div>
            <div className="note">
                Reading guide: each rung shows whether base + offsets is coprime to every prime ≤ p AND whether that
                wheel is large enough to enumerate the pattern's residue class.
                {' '}<span style={{color:'var(--green)'}}>green ✓</span> = base passes here AND wheel is feasible
                (≥ catalog minimum).
                {' '}<span style={{color:'var(--tx2)'}}>gray —</span> = base passes here but wheel is below the
                catalog minimum, so a search using only this wheel could not have found the pattern.
                {' '}<span style={{color:'var(--red)'}}>red ✗</span> = base fails admissibility at this prime.
                The <strong style={{color:'var(--cyan)'}}>cyan-outlined</strong> rung (if present) marks the catalog's
                minimum required primorial. The rightmost ✓ marks the maximum primorial the search could plausibly have
                used. For a record-grade base, the search-side primorial (e.g. <code>--primorial</code> CLI choice) sits
                somewhere in <code>[catalog min, rightmost ✓]</code>.
            </div>
        </CollapsiblePanel>
    );
}

// Format a positive real in compact scientific or fixed form, depending on size.
function fmtSci(x, digits=3) {
    if (x === null || x === undefined || !isFinite(x)) return '—';
    if (x === 0) return '0';
    const absX = Math.abs(x);
    if (absX >= 1e-3 && absX < 1e6) {
        if (absX >= 100) return x.toFixed(0);
        if (absX >= 1) return x.toFixed(2);
        return x.toFixed(digits);
    }
    return x.toExponential(digits - 1);
}

function DensityPanel({res, forceOpen}) {
    const d = res.density;
    if (!d) return null;
    const hkSrc = res.catMatch?.H_k ?? res.mirrorMatch?.H_k ?? null;
    const hkVia = res.catMatch?.H_k != null ? 'direct catalog match'
                : res.mirrorMatch?.H_k != null ? 'mirror catalog match'
                : 'unknown';
    return (
        <CollapsiblePanel
            title="Hardy-Littlewood density at this scale"
            badge={`~1 every ${fmtSci(d.meanGap)} ints`}
            bc="bg" forceOpen={forceOpen}>
            <div className="wheel-summary">
                <span>
                    <span className="label">scale:</span>{' '}
                    <span className="val">{d.digits} digits</span>{' '}
                    <span style={{color:'var(--tx2)'}}>({d.bits} bits, ln N ≈ {d.lnN.toFixed(2)})</span>
                </span>
                <span>
                    <span className="label">H_k used:</span>{' '}
                    <span className="val">{fmtSci(hkSrc)}</span>{' '}
                    <span style={{color:'var(--tx2)'}}>({hkVia})</span>
                </span>
                <span>
                    <span className="label">density:</span>{' '}
                    <span className="val">{fmtSci(d.density)}</span>{' '}
                    <span style={{color:'var(--tx2)'}}>per integer near N</span>
                </span>
                <span>
                    <span className="label">mean gap:</span>{' '}
                    <span className="val">{fmtSci(d.meanGap)}</span>{' '}
                    <span style={{color:'var(--tx2)'}}>integers between consecutive k={res.k}-tuplets</span>
                </span>
                <span>
                    <span className="label">expected in decade:</span>{' '}
                    <span className="val">{fmtSci(d.decadeCount)}</span>{' '}
                    <span style={{color:'var(--tx2)'}}>in [10<sup>{d.digits-1}</sup>, 10<sup>{d.digits}</sup>)</span>
                </span>
            </div>
            <div className="note">
                Hardy-Littlewood k-tuple conjecture: prime k-tuplets matching an admissible pattern have density
                {' '}<code>C_k / log(N)<sup>k</sup></code> near a large base N. So the mean spacing between consecutive
                k-tuplets near N is <code>log(N)<sup>k</sup> / C_k</code>, and the count over a short window [a, b] is
                <code>C_k · (b − a) / log(N)<sup>k</sup></code>.
                {' '}<em>Caveat:</em> catalog <code>H_k</code> is the singular series truncated to small primes
                (factors for p ≤ ~k only). The full <code>C_k = H_k · tail</code> where the tail product over
                p ≫ k converges to roughly 0.5–0.95, so this is a mild over-count — useful for
                order-of-magnitude framing, not precise prediction.
                {res.density.decadeCount != null && res.density.decadeCount > 1e6 && (
                    <> <strong>Interpretation:</strong> at this scale the expected k={res.k}-tuplet count per decade
                    is enormous, so a record here is not <em>rare</em> in the absolute sense — it's a search-effort
                    record (computationally hard to enumerate, not statistically improbable).</>
                )}
                {res.density.decadeCount != null && res.density.decadeCount > 0 && res.density.decadeCount < 100 && (
                    <> <strong>Interpretation:</strong> at this scale only ~{fmtSci(res.density.decadeCount)} k={res.k}-tuplets
                    are expected per decade — a record here genuinely is statistically rare.</>
                )}
            </div>
        </CollapsiblePanel>
    );
}

function CatalogPanel({res, forceOpen}) {
    const cat = KTUPLE_CATALOG[res.k] || [];
    const currentSig = sigOf(res.offsets);
    return (
        <div className="grid2">
            <CollapsiblePanel
                title={`Catalog patterns at k=${res.k}`}
                badge={`${cat.length} known`} bc="bg" forceOpen={forceOpen}>
                {cat.length === 0 && <div style={{color:'var(--tx2)', fontSize:'9px'}}>No catalog patterns at this k.</div>}
                {cat.map((c, i) => {
                    const isCurrent = sigOf(c.offsets) === currentSig;
                    const label = `Pattern #${i+1}  ${c.H_k != null ? `H_k=${c.H_k}` : ''}  mod=${c.modulus}`;
                    return <PatternBlock key={i} offsets={c.offsets} k={null} label={label} highlight={isCurrent} />;
                })}
                <div className="note">Source: pzktupel.de/ktpatt_hl.php (k=2..28).</div>
            </CollapsiblePanel>

            <CollapsiblePanel
                title="Mirror & Symmetry"
                badge={res.isPalindromic ? 'palindromic' : 'mirrored'}
                bc={res.isPalindromic ? 'bg-g' : 'bg-y'} forceOpen={forceOpen}>
                <div style={{marginBottom:'8px', display:'flex', gap:'8px', flexWrap:'wrap', alignItems:'center'}}>
                    <span style={{fontSize:'11px', color:'var(--tx2)'}}>Pattern class:</span>
                    {res.trivialParent
                        ? <span style={{padding:'3px 8px', background:'rgba(251,191,36,.15)', borderRadius:'3px', color:'var(--yellow)', fontSize:'11px'}}
                                title={`This pattern's offsets${res.trivialParent.viaMirror ? ' (via mirror)' : ''}, shifted by +${res.trivialParent.shift}, are a subset of catalog k=${res.trivialParent.k} #${res.trivialParent.idx+1}. Any prime k=${res.trivialParent.k}-tuplet matching the bigger pattern produces this k=${res.k} pattern for free.`}>
                            trivial sub-pattern of k={res.trivialParent.k} #{res.trivialParent.idx+1}
                            {' '}<span style={{color:'var(--tx2)', fontWeight:'normal'}}>
                                (offset shift +{res.trivialParent.shift}{res.trivialParent.viaMirror ? ', via mirror' : ''})
                            </span>
                          </span>
                        : <span style={{padding:'3px 8px', background:'rgba(52,211,153,.15)', borderRadius:'3px', color:'var(--green)', fontSize:'11px'}}
                                title="No catalog pattern at higher k (k=2..28 loaded) contains this pattern or its mirror as a sub-tuple. A record matching this pattern is non-trivial within our catalog scope — independent search effort, not derived from a larger-k discovery.">
                            non-trivial (no larger-k catalog parent)
                          </span>
                    }
                </div>
                <PatternBlock offsets={res.offsets} k={res.k} label="This pattern" highlight />
                <PatternBlock
                    offsets={res.mirror}
                    k={res.k}
                    label={res.isPalindromic
                        ? 'Mirror = self'
                        : res.mirrorMatch
                            ? `Mirror = catalog #${res.mirrorMatch.idx + 1}`
                            : 'Mirror image (not in our catalog)'}
                    highlight={res.isPalindromic} />
                {res.trivialParent && (
                    <PatternBlock
                        offsets={res.trivialParent.offsets}
                        k={res.trivialParent.k}
                        label={`Larger-k parent: catalog k=${res.trivialParent.k} #${res.trivialParent.idx+1} (shift +${res.trivialParent.shift})`} />
                )}
                <div className="note">
                    A pattern and its mirror (max−d, sorted) cover the same residue classes mod every prime
                    and share H_k. Palindromic patterns are equal to their mirror.
                    {' '}<strong>Trivial/non-trivial:</strong> a pattern is <em>trivial</em> if its offsets (or its
                    mirror's offsets, after a constant shift) are a subset of some catalog pattern with higher k —
                    any prime k′-tuplet matching the bigger pattern produces this one for free. Only <em>non-trivial</em>
                    patterns require an independent search effort. Matches Luhn's pzktupel.de terminology.
                    {' '}<em>Note:</em> this is a <strong>structural</strong> check against the loaded catalog
                    (k=2..28, sparse above k=24). It says nothing about whether a record at the larger-k parent has
                    actually been found, and a "non-trivial" verdict means "no parent in our catalog" — a parent
                    might exist at higher k beyond what we list.
                </div>
            </CollapsiblePanel>
        </div>
    );
}

// ===== Pattern-match scanner panel =====
function MatchesPanel({matches, selectedSig, onSelect, forceOpen}) {
    const full = matches.filter(m => m.kind === 'full');
    const partial = matches.filter(m => m.kind === 'partial');
    return (
        <div>
            <div className="matches-stats">
                <span>scanned: <strong>{matches.length}</strong></span>
                <span>full matches: <strong style={{color: full.length ? 'var(--green)' : 'var(--tx2)'}}>{full.length}</strong></span>
                <span>partial: <strong>{partial.length}</strong></span>
                <span style={{color:'var(--tx2)'}}>(inadmissible patterns omitted)</span>
            </div>
            {matches.length === 0 && (
                <div style={{padding:'8px', color:'var(--tx2)', fontSize:'10px'}}>
                    No catalogued or custom pattern is admissible at this base. Either the input is divisible by a
                    small prime that all relevant patterns force a member onto, or the input doesn't fit any pattern
                    in the catalog (≤k=28).
                </div>
            )}
            <div className="matches-shell">
                {matches.map((m, i) => {
                    const sig = sigOf(m.offsets);
                    const isSel = sig === selectedSig;
                    const cls = `match-card ${m.kind} ${isSel?'selected':''}`;
                    const sourceLabel = m.source === 'custom' ? `custom @ line ${m.lineNo}` : `catalog k=${m.k} #${m.idx + 1}`;
                    return (
                        <div key={i} className={cls} onClick={() => onSelect(m)}>
                            <div className="match-head">
                                <span className="k">k={m.k}</span>
                                {m.kind === 'full'
                                    ? <span className="full-badge">✓ FULL k={m.k}</span>
                                    : <span className="partial-badge">{m.kActual}/{m.k} prime</span>}
                                <span className="source">{sourceLabel}</span>
                                {m.H_k != null && <span className="h-k">H_k={m.H_k}</span>}
                                {m.modulus != null && <span style={{fontSize:'9px',color:'var(--tx2)'}}>mod {m.modulus}</span>}
                            </div>
                            <div className="match-offsets">d = [{m.offsets.join(', ')}]</div>
                            <div className="match-detail">
                                width {m.offsets[m.offsets.length-1]}
                                {m.kind === 'partial' && m.firstComposite && (
                                    <> · first composite at +{m.offsets[m.firstComposite.idx]} (member {m.firstComposite.idx})</>
                                )}
                            </div>
                        </div>
                    );
                })}
            </div>
        </div>
    );
}

function CustomPatternsArea({text, onChange, parsed}) {
    return (
        <div className="custom-area">
            <div className="head">
                <span className="lbl">★ Custom patterns</span>
                <span className="count">{parsed.length} parsed</span>
            </div>
            <textarea
                value={text}
                placeholder={'One pattern per line, comma-separated offsets. Example:\n0,2,6,8\n0,4,6,10,12,16\n# lines starting with # are ignored'}
                onChange={e => onChange(e.target.value)} />
            <div className="help">
                Each pattern must start with 0 and have ascending offsets. Patterns are merged into the scan and
                appear as "custom @ line N" in the matches list. Persisted in the URL via the <code>?n=…</code> share.
            </div>
        </div>
    );
}

// ===== MAIN APP =====
function App() {
    const urlParams = getUrlParams();
    const [input, setInput] = useState(urlParams.n);
    const [customText, setCustomText] = useState('');
    const [fmt, setFmt] = useState(urlParams.fmt);
    const [base, setBase] = useState(null);            // BigInt
    const [matches, setMatches] = useState(null);
    const [selectedSig, setSelectedSig] = useState(urlParams.offsets || null);
    const [res, setRes] = useState(null);
    const [scanning, setScanning] = useState(false);
    const [scanMs, setScanMs] = useState(0);
    const [err, setErr] = useState(null);
    const [expandAll, setExpandAll] = useState(false);
    const [copied, setCopied] = useState('');

    // Examples to seed the input box.
    const examples = [
        {l:'twin (5,7)',         v:'5'},
        {l:'sextuplet @ 7',      v:'7'},
        {l:'k=18 record',        v:'1906230835046648293290043'},
        {l:'k=21 record',        v:'622803914376064301858782434517'},
        {l:'primorial 53#·2−1',  v:'53#*2-1'},
    ];

    const customPatterns = useMemo(() => parseCustomPatterns(customText), [customText]);

    const runScan = useCallback(() => {
        setScanning(true); setErr(null); setExpandAll(false);
        setMatches(null); setRes(null);
        setTimeout(() => {
            try {
                const n = parseInput(input);
                if (n < 2n) throw new Error('Input must be ≥ 2.');
                const t0 = performance.now();
                const allPats = [...customPatterns, ...allCatalogPatterns()];
                const ms = scanPatterns(n, allPats);
                const t1 = performance.now();
                setBase(n);
                setMatches(ms);
                setScanMs(Math.round(t1 - t0));
                // Pick selection: prefer URL-provided offsets if it matched, else top match
                let sel = null;
                if (selectedSig) {
                    sel = ms.find(m => sigOf(m.offsets) === selectedSig) || null;
                }
                if (!sel) sel = ms[0] || null;
                if (sel) {
                    const newSig = sigOf(sel.offsets);
                    setSelectedSig(newSig);
                    setRes(analyze(n, sel.offsets, {match: sel}));
                    updateUrl({n: input, offsets: newSig, fmt});
                } else {
                    setSelectedSig(null);
                    updateUrl({n: input, offsets: '', fmt});
                }
            } catch (e) {
                setErr(e.message); setRes(null); setMatches(null);
            }
            setScanning(false);
        }, 20);
    }, [input, customPatterns, fmt, selectedSig]);

    // Initial run if URL had ?n=…
    useEffect(() => { if (urlParams.n) runScan(); }, []);

    const selectMatch = (m) => {
        const sig = sigOf(m.offsets);
        setSelectedSig(sig);
        setRes(analyze(base, m.offsets, {match: m}));
        updateUrl({n: input, offsets: sig, fmt});
    };

    const handleShare = () => {
        navigator.clipboard.writeText(generateShareLink({n: input, offsets: selectedSig, fmt}));
        setCopied('link'); setTimeout(()=>setCopied(''), 1500);
    };

    const baseLine = base ? base.toString() : '';
    const baseHex = base ? toHex(base) : '';

    return (
        <div className="app">
            <div className="topbar">
                <h1>★ k-Tuplet Analyzer v3.1</h1>
                <span style={{fontSize:'9px', color:'var(--tx2)'}}>paste prime → match against ≤k=28 patterns</span>
                <input
                    type="text" value={input}
                    onChange={e => setInput(e.target.value)}
                    onKeyDown={e => { if (e.key === 'Enter') runScan(); }}
                    placeholder="0x..., decimal, or k*p#*m±d (primorial)"
                    style={{flex:1, minWidth:'260px'}} />
                <button className="btn primary" onClick={runScan} disabled={scanning}>
                    {scanning ? '…' : 'Analyze'}
                </button>
                <select value={fmt} onChange={e => { setFmt(e.target.value); if (res) updateUrl({n: input, offsets: selectedSig, fmt: e.target.value}); }}>
                    <option value="dec">DEC</option>
                    <option value="hex">HEX</option>
                </select>
                {res && <button className="btn btn-expand" onClick={() => setExpandAll(!expandAll)}>{expandAll?'Collapse':'Expand All'}</button>}
                <button className="btn btn-expand" onClick={handleShare}>{copied==='link'?'✓ Copied':'🔗 Share'}</button>
                <div style={{display:'flex', gap:'3px', flexWrap:'wrap'}}>
                    {examples.map((ex, i) => (
                        <button key={i} className="btn btn-expand" onClick={() => setInput(ex.v)}>{ex.l}</button>
                    ))}
                </div>
            </div>

            {/* Custom patterns area, always visible */}
            <CustomPatternsArea text={customText} onChange={setCustomText} parsed={customPatterns} />

            {err && <div className="err">{err}</div>}
            {scanning && <div className="loading">Scanning {customPatterns.length + allCatalogPatterns().length} patterns…</div>}

            {/* Pattern matches list — shows even before a pattern is selected */}
            {matches && !scanning && (<>
                <div className="section-title">
                    ★ Pattern Matches
                    <span style={{fontSize:'9px', color:'var(--tx2)', marginLeft:'8px'}}>
                        scan in {scanMs} ms · base bits = {base.toString(2).length}
                    </span>
                </div>
                {/* Quick header showing pasted base */}
                <div className="panel" style={{padding:'6px 8px'}}>
                    <div style={{fontSize:'10px', color:'var(--tx2)'}}>
                        Input: {fmt === 'hex' ? baseHex.slice(0,40) + (baseHex.length > 40 ? '…' : '') : (baseLine.length > 50 ? baseLine.slice(0,30) + '…' + baseLine.slice(-12) : baseLine)}
                        {' '}· {base.toString().length} digits · {base.toString(2).length} bits
                        {' '}· itself prime: {isPrime(base)
                            ? <strong style={{color:'var(--green)'}}>YES</strong>
                            : <strong style={{color:'var(--red)'}}>NO</strong>}
                    </div>
                </div>
                <MatchesPanel matches={matches} selectedSig={selectedSig} onSelect={selectMatch} forceOpen={expandAll||undefined} />
            </>)}

            {res && !scanning && (<>
                {/* ===== Selected-pattern banner ===== */}
                <div style={{display:'flex', gap:'14px', padding:'10px 16px', background:'var(--bg2)',
                             borderRadius:'6px', marginBottom:'10px', alignItems:'center', flexWrap:'wrap',
                             border:'1px solid var(--border)'}}>
                    <div style={{fontSize:'11px', color:'var(--tx2)'}}>Selected pattern:</div>
                    <div style={{display:'flex', alignItems:'baseline', gap:'4px'}}>
                        <span style={{fontSize:'22px', fontWeight:700,
                                color: res.fullKtuplet ? 'var(--green)' :
                                       res.primeCount >= res.k - 2 ? 'var(--yellow)' : 'var(--red)'}}>
                            {res.primeCount}/{res.k}
                        </span>
                        <span style={{fontSize:'10px', color:'var(--tx2)'}}>members prime</span>
                    </div>
                    {res.fullKtuplet && (
                        <div style={{padding:'4px 10px', background:'var(--green)', borderRadius:'4px',
                                     color:'#000', fontWeight:700, fontSize:'11px'}}>
                            ✓ FULL k={res.k} TUPLET
                        </div>
                    )}
                    {res.isAdmissiblePattern
                        ? <span style={{padding:'2px 6px', background:'rgba(52,211,153,.2)', borderRadius:'3px', color:'var(--green)', fontSize:'10px'}}>admissible pattern</span>
                        : <span style={{padding:'2px 6px', background:'rgba(248,113,113,.2)', borderRadius:'3px', color:'var(--red)', fontSize:'10px'}}>INADMISSIBLE pattern</span>
                    }
                    <div style={{fontSize:'10px', color:'var(--tx2)'}}>
                        Width: {res.width}
                        {res.minWidth !== null && (
                            <> {' '}/ s({res.k})={res.minWidth}{' '}
                                <span style={{color: res.widthOverMin === 0 ? 'var(--green)' : 'var(--yellow)'}}>
                                    {res.widthOverMin === 0 ? '✓ minimal' : `+${res.widthOverMin}`}
                                </span>
                            </>
                        )} | bits: {res.members[0].bits}
                    </div>
                    {res.catMatch && (
                        <span style={{padding:'2px 6px', background:'rgba(34,211,238,.15)', borderRadius:'3px', color:'var(--cyan)', fontSize:'10px'}}>
                            catalog k={res.k} #{res.catMatch.idx + 1}
                            {res.catMatch.H_k != null && <> · H_k={res.catMatch.H_k}</>}
                            {' · mod '}{res.catMatch.modulus}
                        </span>
                    )}
                    {res.modCheck && (
                        <span style={{padding:'2px 6px', background:'rgba(34,211,238,.10)', borderRadius:'3px', color:'var(--cyan)', fontSize:'10px'}}>
                            base mod {res.modCheck.modulus} = {res.modCheck.baseMod}
                        </span>
                    )}
                    {res.wd && (() => {
                        const showRange = res.catMinP && res.wd.breakP === null && res.catMinP <= res.wd.deepestP;
                        return (
                        <span style={{padding:'2px 6px',
                                      background: res.wd.breakP === null ? 'rgba(52,211,153,.15)' : 'rgba(251,191,36,.15)',
                                      borderRadius:'3px',
                                      color: res.wd.breakP === null ? 'var(--green)' : 'var(--yellow)',
                                      fontSize:'10px'}}
                              title={res.wd.breakP === null
                                ? `Base passes admissibility at every tested prime ≤ ${res.wd.chain[res.wd.chain.length-1].prime}; search-side wheel could plausibly be any primorial in [${res.catMinP ? res.catMinP + '#' : 'catalog min'}, ${res.wd.deepestP}#]`
                                : `Base fails admissibility at ÷${res.wd.breakP}; consistent only with wheels ≤ ${res.wd.deepestP}#`}>
                            {showRange
                                ? `wheel ∈ [${res.catMinP}#, ${res.wd.deepestP}#] ✓`
                                : `wheel ≤ ${res.wd.deepestP}#${res.wd.breakP === null ? ' ✓' : ` (breaks ÷${res.wd.breakP})`}`}
                        </span>);
                    })()}
                    {res.trivialParent
                        ? <span style={{padding:'2px 6px', background:'rgba(251,191,36,.15)', borderRadius:'3px', color:'var(--yellow)', fontSize:'10px'}}
                                title={`Pattern${res.trivialParent.viaMirror ? "'s mirror" : ''} is a sub-tuple of catalog k=${res.trivialParent.k} #${res.trivialParent.idx+1} (offset shift +${res.trivialParent.shift}). Any prime k=${res.trivialParent.k}-tuplet matching that bigger pattern produces this k=${res.k} pattern for free — Luhn's "trivial" classification.`}>
                            trivial ⊂ k={res.trivialParent.k}#{res.trivialParent.idx+1}
                            {res.trivialParent.viaMirror ? ' (mirror)' : ''}
                          </span>
                        : <span style={{padding:'2px 6px', background:'rgba(52,211,153,.15)', borderRadius:'3px', color:'var(--green)', fontSize:'10px'}}
                                title="No catalog pattern at higher k (k=2..28 loaded) contains this pattern or its mirror as a sub-tuple. Matches Luhn's pzktupel.de 'non-trivial known to given pattern' classification within our catalog scope — a record at this pattern is independent search effort, not derived from a larger-k discovery.">
                            non-trivial
                          </span>
                    }
                </div>

                {/* ===== Overview row ===== */}
                <div className="grid3">
                    <CollapsiblePanel title="Base & Pattern" badge={`k=${res.k}`} bc="bg" forceOpen={expandAll||undefined}>
                        <CopyBox value={res.base.toString()} label="base (dec)" />
                        <CopyBox value={toHex(res.base)} label="base (hex)" />
                        <P k="Bits" v={res.base.toString(2).length} />
                        <P k="Digits" v={res.base.toString().length} />
                        <P k="Width" v={res.width} />
                        <P k="Density" v={`${(res.k/(res.width+1)*100).toFixed(1)}%`} />
                        <P k="Source" v={res.ctx?.match?.source === 'custom' ? `custom @ line ${res.ctx.match.lineNo}` : (res.catMatch ? `catalog k=${res.k} #${res.catMatch.idx+1}` : '—')} />
                    </CollapsiblePanel>
                    <CollapsiblePanel title="Status" badge={res.fullKtuplet?'COMPLETE':'PARTIAL'} bc={res.fullKtuplet?'bg-g':'bg-y'} forceOpen={expandAll||undefined}>
                        <P k="Members prime" v={`${res.primeCount}/${res.k}`} />
                        <P k="Pattern admissible" v={res.isAdmissiblePattern ? 'YES' : 'NO'} />
                        <P k="Base in admissible cell" v={res.baseAdmissibleAtAll ? 'YES' : 'NO'} />
                        {res.modCheck && (
                            <P k={`base mod ${res.modCheck.modulus}`} v={res.modCheck.baseMod} mono />
                        )}
                    </CollapsiblePanel>
                    <CollapsiblePanel title="Residues" badge="base mod p" bc="bg-y" forceOpen={expandAll||undefined}>
                        {RESIDUE_PRIMES.map(p => (
                            <P key={p} k={`base mod ${p}`} v={res.baseResidueAt[p]} mono />
                        ))}
                    </CollapsiblePanel>
                </div>

                {/* ===== Pattern Catalog ===== */}
                <div className="section-title">★ Pattern Catalog (at this k)</div>
                <CatalogPanel res={res} forceOpen={expandAll||undefined} />

                <div className="section-title">★ Wheel-depth Ladder</div>
                <WheelDepthPanel res={res} forceOpen={expandAll||undefined} />

                {res.density && <>
                    <div className="section-title">★ Density at scale</div>
                    <DensityPanel res={res} forceOpen={expandAll||undefined} />
                </>}

                {/* ===== Pattern visualization ===== */}
                <div className="section-title">★ Pattern on Number Line</div>
                <CollapsiblePanel title="Offsets visualized" badge={`width ${res.width}`} bc="bg" forceOpen={expandAll||undefined}>
                    <NumberLinePanel res={res} />
                </CollapsiblePanel>

                {/* ===== Members ===== */}
                <div className="section-title">★ Tuple Members</div>
                <CollapsiblePanel title="Members table" badge={`${res.primeCount}/${res.k} prime`} bc={res.fullKtuplet?'bg-g':'bg-y'} forceOpen={expandAll||undefined}>
                    <MembersPanel res={res} fmt={fmt} />
                </CollapsiblePanel>

                {/* ===== Admissibility ===== */}
                <div className="section-title">★ CRT Admissibility Grid</div>
                <CollapsiblePanel
                    title="Admissibility (rows = small primes, cols = base residue)"
                    badge={res.isAdmissiblePattern?'admissible':'INADMISSIBLE'}
                    bc={res.isAdmissiblePattern?'bg-g':'bg-r'}
                    forceOpen={expandAll||undefined}>
                    <AdmissibilityPanel res={res} />
                </CollapsiblePanel>

                {/* ===== Composite proximity (member-centric) ===== */}
                <div className="section-title">★ Composite Proximity (member-centric ±range)</div>
                <CollapsiblePanel
                    title="Smallest prime factor around each member ± range (±4 to ±100)"
                    bc="bg-o" forceOpen={expandAll||undefined}>
                    <ProximityPanel res={res} fmt={fmt} />
                </CollapsiblePanel>

                {/* ===== Inter-member composite texture ===== */}
                <div className="section-title">★ Inter-Member Composite Texture (positions inside the tuple span)</div>
                <CollapsiblePanel
                    title={`Smallest prime factor at every position from base+0 to base+${res.width}`}
                    bc="bg-o" forceOpen={expandAll||undefined}>
                    <InterMemberCompositesPanel res={res} fmt={fmt} />
                </CollapsiblePanel>

                {/* ===== About / parallel-to-CC info ===== */}
                <div className="section-title">About</div>
                <div style={{fontSize:'10px', color:'var(--tx1)', background:'var(--bg2)', padding:'8px',
                             borderRadius:'4px', lineHeight:1.5}}>
                    <strong style={{color:'var(--cyan)'}}>Sieve architecture transfer.</strong> Same primorial wheel,
                    same bitmap structure, same GPU/CPU split as the Cunningham-chain pipeline. The substitution:
                    CC checks "does residue class survive multiplication-by-2 chain extension," k-tuple checks
                    "does residue class survive additive-offset constellation."<br/><br/>
                    <strong style={{color:'var(--cyan)'}}>What's different.</strong> Admissibility theory replaces
                    chain-existence theory. For CC the question is "will this candidate extend to length L"; for
                    k-tuples the question is "is this pattern admissible at all, and if so how rare is it locally."
                    Factorization-depth structure also differs: CC's d1/d2/d3/d4 layers across links are algebraically
                    related (each link doubled from previous); k-tuple's layers across members are algebraically
                    independent (different additive offsets). Whether empirical crossovers exist despite that
                    independence is an open question this analyzer is meant to explore.
                </div>
            </>)}

            <div className="footer">
                <div style={{marginBottom:'4px'}}>
                    <strong style={{color:'var(--cyan)'}}>Prime k-Tuplet Analyzer v3.1</strong>
                </div>
                <div>
                    © 2026 <a href="https://be.linkedin.com/in/nenadmicic" target="_blank">Nenad Mićić</a>
                </div>
                <div style={{marginTop:'4px'}}>
                    License: <a href="https://www.apache.org/licenses/LICENSE-2.0" target="_blank">Apache-2.0</a> |
                    Data: pzktupel.de/Top10.php
                </div>
            </div>
        </div>
    );
}

ReactDOM.render(<App />, document.getElementById('root'));
</script>
</body>
</html>
